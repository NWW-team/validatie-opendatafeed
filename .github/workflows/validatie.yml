name: Validatie opendatafeed

on:
  schedule:
    # Elke werkdag om 07:15 UTC (09:15 Nederlandse zomertijd), vóór het
    # spreekuur waarin meldingen uit afnemende systemen binnenkomen.
    - cron: "15 7 * * 1-5"
  workflow_dispatch:
    inputs:
      check-files:
        description: "Kaartbestanden daadwerkelijk ophalen"
        type: boolean
        default: false
      check-website:
        description: "Vergelijken met nederlandwereldwijd.nl"
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/validatie.yml"

permissions:
  contents: read

concurrency:
  group: validatie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests en lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeer het pakket
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  valideer:
    name: Feed valideren
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeer het pakket
        run: pip install -e .

      - name: Valideer de opendatafeed
        id: valideer
        # De exitcode blijft 0 zodat het rapport altijd gepubliceerd wordt;
        # de stap hieronder laat de run alsnog falen bij harde fouten.
        run: |
          feedvalidator \
            --output-dir rapport \
            --save-snapshot rapport/snapshot.json \
            --allow-isocode BQ-BO --allow-isocode BQ-SA --allow-isocode BQ-SE \
            ${{ (inputs.check-files && '--check-files') || '' }} \
            ${{ (inputs.check-website && '--check-website') || '' }} \
            --fail-on never \
            --quiet

      - name: Zet de samenvatting in het run-overzicht
        if: always()
        run: cat rapport/rapport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Bewaar het rapport als artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validatierapport-${{ github.run_number }}
          path: rapport/
          retention-days: 90

      - name: Laat de run falen bij blokkerende bevindingen
        run: |
          python - <<'PY'
          import json, sys
          rapport = json.load(open("rapport/rapport.json"))
          samenvatting = rapport["summary"]
          print(
              f"fouten={samenvatting['errors']} "
              f"waarschuwingen={samenvatting['warnings']} "
              f"landen={rapport['countries_checked']}"
          )
          sys.exit(1 if samenvatting["errors"] else 0)
          PY
