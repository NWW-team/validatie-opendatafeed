name: Rapport publiceren

# Publiceert het HTML-rapport op GitHub Pages, zodat de product owner een vaste
# URL heeft. Zet Pages in de repo-instellingen op "GitHub Actions" voordat deze
# workflow voor het eerst draait.

on:
  # Na elke merge naar main, zodat de gepubliceerde pagina meteen bij de code
  # past en niemand een knop hoeft te zoeken.
  push:
    branches: [main]
  schedule:
    - cron: "45 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk, maar een lopende deploy nooit afbreken: die zet de
# live pagina neer en moet af kunnen maken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Valideer de opendatafeed
        run: |
          feedvalidator --output-dir _site \
            --allow-isocode BQ-BO --allow-isocode BQ-SA --allow-isocode BQ-SE \
            --negeer-land vaticaanstad \
            --gesloten-post ambassade-kaboel \
            --gesloten-post ambassade-tripoli \
            --gesloten-post consulaat-generaal-st-petersburg \
            --gesloten-post ambassade-khartoem \
            --gesloten-post ambassade-damascus \
            --alleen-samenvatting \
            --fail-on never --quiet
      - name: Zet de afgeschermde schil erbij
        # De schil is een publiek bestand zonder inhoud: hij toont pas
        # bevindingen na inloggen, en alleen als de database ze vrijgeeft.
        run: |
          mkdir -p _site/toegang
          cp web/index.html web/app.js web/config.js _site/toegang/

      - name: Schrijf de bevindingen naar Supabase
        # De publieke pagina toont alleen aantallen (--alleen-samenvatting);
        # dit is de stap die de echte rijen achter de inlog zet. Zonder de
        # SUPABASE_SERVICE_ROLE_KEY-secret slaat deze stap zichzelf over, dan
        # blijft de rest van de publicatie gewoon werken — alleen staat er
        # achter /toegang/ dan nog de demoronde uit db/0001_toegang.sql.
        #
        # continue-on-error: deze stap mag nooit de publicatie van de
        # openbare pagina blokkeren. Faalt Supabase (verkeerde sleutel,
        # netwerkstoring), dan staat die fout hier zichtbaar in de log en
        # draait de rest van de workflow gewoon door.
        continue-on-error: true
        env:
          SUPABASE_URL: https://tkfasdijhdthywxorqwa.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          import requests

          url = os.environ["SUPABASE_URL"]
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip()
          if not key:
              print("Geen SUPABASE_SERVICE_ROLE_KEY ingesteld; deze stap slaat zichzelf over.")
              sys.exit(0)

          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }

          rapport = json.load(open("_site/rapport.json"))

          nieuwe_ronde = {
              "gegenereerd_op": rapport["generated_at"],
              "base_url": rapport["base_url"],
              "samenvatting": rapport["summary"],
          }
          def mislukt(antwoord: "requests.Response", waarbij: str) -> None:
              print(f"Supabase weigerde het verzoek ({waarbij}): HTTP {antwoord.status_code}")
              print(antwoord.text[:2000])
              sys.exit(1)

          antwoord = requests.post(
              f"{url}/rest/v1/rapporten",
              headers={**headers, "Prefer": "return=representation"},
              json=nieuwe_ronde,
              timeout=30,
          )
          if not antwoord.ok:
              mislukt(antwoord, "nieuwe ronde aanmaken")
          rapport_id = antwoord.json()[0]["id"]

          bevindingen = [
              {
                  "rapport_id": rapport_id,
                  "regel_id": vinding["rule_id"],
                  "regel_titel": vinding["rule_title"],
                  "zwaarte": vinding["severity"],
                  "boodschap": vinding["message"],
                  "land": vinding.get("location"),
                  "isocode": vinding.get("isocode"),
              }
              for regel in rapport["results"]
              for vinding in regel["findings"]
          ]
          for start in range(0, len(bevindingen), 500):
              deel = bevindingen[start : start + 500]
              antwoord = requests.post(
                  f"{url}/rest/v1/bevindingen", headers=headers, json=deel, timeout=60
              )
              if not antwoord.ok:
                  mislukt(antwoord, f"bevindingen {start}-{start + len(deel)}")

          # Eén actuele ronde in de tabel houden, niet eindeloos laten opstapelen;
          # bevindingen van oudere rondes verdwijnen mee via de foreign key.
          antwoord = requests.delete(
              f"{url}/rest/v1/rapporten",
              headers=headers,
              params={"id": f"neq.{rapport_id}"},
              timeout=30,
          )
          if not antwoord.ok:
              mislukt(antwoord, "oudere rondes opruimen")

          print(f"Ronde {rapport_id} geschreven met {len(bevindingen)} bevinding(en).")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
